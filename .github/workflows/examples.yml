name: Self-contained Java examples
on: [push, pull_request]
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac examples/ParadigmComparison.java examples/ParadigmComparisonTest.java
      - run: java -cp examples ParadigmComparisonTest
